name: Daily Event Scraper

on:
  schedule:
    # Full daily sweep: every morning at 6:00 AM Pacific Time (13:00 UTC)
    - cron: '0 13 * * *'
    # BACKUP daily sweep: 1:00 PM Pacific (20:00 UTC).
    #
    # Added 2026-08-24. That morning's run (#138) never executed a single step:
    # GitHub failed to allocate a hosted runner and cancelled the job after 15
    # minutes with "The job was not acquired by Runner of type hosted even
    # after multiple attempts". Nothing in this repo was wrong -- and nothing
    # in this repo could have prevented it.
    #
    # The cost was not the failed run, it was the SILENCE afterwards: seven
    # expired events kept rendering as upcoming all day, including one that had
    # already happened, and the only reason anyone noticed was the failure
    # email. A single daily attempt means any GitHub-side hiccup shows stale
    # events to families until the next morning.
    #
    # This run is a no-op when the morning one worked: the purge is computed
    # from today's date rather than from a cursor, so a second run finds
    # nothing to change and the commit step exits 0 on "No changes to commit".
    # It costs about 90 seconds of Actions time.
    - cron: '0 20 * * *'
    # NO SEPARATE MONTHLY CRON. There used to be one here -- '0 13 1 * *' --
    # and it caused a guaranteed failure on the 1st of every month.
    #
    # Both it and the daily cron fire at 13:00 UTC, so on the 1st two runs
    # started 45 seconds apart (runs 153 and 154 on 2026-09-01). The
    # concurrency group serialised them rather than running them together, but
    # that did not help: the first run committed its purge and pushed, and the
    # second then rebased onto a main that already contained a near-identical
    # change to events.json, conflicted, and hit the workflow's own
    # "Rebase conflict against origin/main. Not retrying -- needs a human."
    #
    # The second run's work was entirely redundant -- the purge is derived from
    # today's date, so both runs computed the same thing. The fix is to have one
    # run per day and let it decide whether to also do the monthly audit, which
    # is what the audit step below now does with a date check.
    #
    # The 20:00 backup run is what actually saved 2026-09-01: run 155 succeeded
    # that evening, so no data was stale despite the failure email.
  # Also allows you to run it manually from GitHub if needed
  workflow_dispatch:
    inputs:
      run_weekly_sweep:
        description: 'Run weekly event sweep'
        required: false
        default: 'false'
      run_monthly_audit:
        description: 'Run monthly recurring events audit'
        required: false
        default: 'false'

# Two schedules both fire at 13:00 UTC on the 1st of the month, which used to
# mean two runs racing to push. Serialise instead of racing.
concurrency:
  group: daily-scraper
  cancel-in-progress: false

jobs:
  update-events:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write   # the notification step opens/updates one rolling issue

    steps:
      # Step 1: Check out your repository
      - name: Checkout repository
        # v5 (was v4) — bumped 2026-09-03 to get off the Node 20 runtime, which
        # GitHub is retiring. v4 still ran, but every run logged a deprecation
        # warning and was force-migrated to Node 24 anyway; this makes that
        # explicit rather than leaving it to a forced migration we did not choose.
        uses: actions/checkout@v5

      # Step 2: Set up Python
      - name: Set up Python
        # v6 (was v5) — same Node 20 retirement as the checkout bump above.
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Step 3: Install dependencies
      - name: Install Python dependencies
        run: pip install openpyxl

      # Step 4: Run the daily scraper
      - name: Run daily scraper
        env:
          BIBLIOCOMMONS_API_KEY: ${{ secrets.BIBLIOCOMMONS_API_KEY }}
        run: python scraper.py

      # Step 5: Run full event sweep (every morning)
      - name: Run weekly event sweep
        if: github.event.schedule == '0 13 * * *' || github.event.schedule == '0 20 * * *' || github.event.inputs.run_weekly_sweep == 'true'
        run: python library_review.py --weekly-sweep

      # Step 6: Run monthly audit on the 1st of each month
      # Runs inside the ordinary daily run on the 1st, rather than from its own
      # cron. `if:` cannot test the date, so the guard is in the shell.
      - name: Run monthly recurring events audit
        # Morning run only. The 20:00 backup is also a 'schedule' event, and
        # without this it would redo the audit on the 1st -- harmless, but a
        # second pointless run of a ~2,000-line script.
        if: github.event.schedule == '0 13 * * *' || github.event.inputs.run_monthly_audit == 'true'
        run: |
          set -euo pipefail
          if [ "$(date -u +%d)" = "01" ] || [ "${{ github.event.inputs.run_monthly_audit }}" = "true" ]; then
            echo "Running the monthly audit."
            python library_review.py --monthly-audit
          else
            echo "Not the 1st of the month -- skipping the monthly audit."
          fi

      # Step 6b: Prove the scraper actually ran today. scraper.py rewrites
      # scraper_log.txt with today's date on every successful run, so a stale
      # date here means the Python failed quietly and there is nothing worth
      # committing. Fail loudly rather than pushing a no-op.
      - name: Verify the scraper produced fresh output
        run: |
          set -euo pipefail
          today="$(date -u +'%Y-%m-%d')"
          if ! grep -q "^Date: ${today}$" scraper_log.txt; then
            echo "::error::scraper_log.txt is not dated ${today} — scraper.py did not complete."
            echo "--- scraper_log.txt (head) ---"
            head -5 scraper_log.txt || true
            exit 1
          fi
          echo "scraper_log.txt is dated ${today}."

      # Step 6c: Nightly duplicate check. Five duplicate pairs reached the live
      # site in two days (2026-08-12/13), each showing the same event twice.
      # This runs AFTER the scraper's purge, so it sees the same data the site
      # will. Deliberately NON-BLOCKING: a duplicate is a data-quality problem
      # for a human to judge, not a reason to abandon a purge that is already
      # correct. It annotates the run instead, so the commit still lands.
      - name: Check for duplicate events
        continue-on-error: true
        run: |
          set -uo pipefail
          if python check_duplicates.py | tee duplicate_report.txt; then
            echo "Duplicate check clean."
            echo "DUPES=0" >> "$GITHUB_ENV"
          else
            echo "::warning::check_duplicates.py found possible duplicates — see the output above."
            echo "DUPES=1" >> "$GITHUB_ENV"
          fi

      # Step 7: Commit and push any changes back to GitHub
      #
      # REWRITTEN 2026-08-13. The previous version did:
      #     git stash --include-untracked || true
      #     git pull --rebase origin main
      #     git stash pop || true
      #     git add ... || true
      #     git diff --staged --quiet || git commit ...
      #     git push
      # actions/checkout gives a clean tree at current main, so there was
      # nothing to stash *before* the scraper ran — the stash was only ever
      # holding the scraper's own output. When the pull brought down commits
      # touching events.json, `stash pop` conflicted, `|| true` swallowed it,
      # nothing got staged, and the run still reported success. That is the
      # bug: ~110 green runs with zero commits since 2026-05-08.
      #
      # Now: commit FIRST (no stash), then rebase that commit onto origin and
      # push, retrying only for the genuine race where someone pushes in
      # between. No `|| true` anywhere on the critical path.
      - name: Commit updated files
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "Out AND About Marin Bot"

          # Stage only the generated files that actually exist. `git add` on a
          # missing pathspec is an error, which is what the old `|| true` was
          # really masking. Review workbooks are deliberately NOT staged — per
          # CLAUDE.md they live in Alexandra's Documents folder, never the repo.
          for f in events.json scraper_log.txt library_page_hashes.json \
                   weekly_sweep_report.json monthly_audit_report.json; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done

          if git diff --staged --quiet; then
            echo "No changes to commit — nothing for the scraper to do today."
            exit 0
          fi

          echo "--- staged changes ---"
          git diff --staged --stat

          git commit -m "Daily update: events refreshed $(date +'%Y-%m-%d')"

          # Rebase our commit onto anything pushed since checkout, then push.
          # Retries cover the real race; a rebase CONFLICT is not retried,
          # because repeating it would not help and must surface to a human.
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Rebase conflict against origin/main. Not retrying — needs a human."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed (likely a concurrent push). Retrying..."
            sleep $((attempt * 5))
          done

          echo "::error::Could not push after 3 attempts."
          exit 1

      # Step 8: Surface anything a human has to act on, as ONE rolling GitHub
      # Issue assigned to Alexandra.
      #
      # Added 2026-08-15 (open item 31). Design notes, because the obvious
      # implementations are all worse:
      #
      #  * ONE rolling issue, not one per run. A new issue every morning for
      #    the same unchanged finding is ~30 emails a month; it gets filtered
      #    within a week and then the rare finding that matters is invisible
      #    too. The issue is created when findings appear, updated only when
      #    they CHANGE, and closed automatically when they clear.
      #  * ASSIGNED, not just opened. GitHub's default notification setting is
      #    "Participating and @mentions", which does NOT email you for an issue
      #    a bot opened on a repo you merely own. Assignment notifies
      #    regardless, so this is what makes the whole thing actually arrive.
      #  * Page-change flags are deliberately NOT in here — 11-13 of 16 pages
      #    per day against a fresh baseline. They stay in scraper_log.txt for
      #    the weekly sweep. See write_findings() in scraper.py.
      #  * Workflow FAILURE is not handled here at all: GitHub already emails
      #    the owner, confirmed enabled 2026-08-15. Combined with the step 6b
      #    liveness check, a silent breakage now fails loudly.
      #
      # Non-blocking: a notification problem must never fail a run whose data
      # work already succeeded and pushed.
      - name: Report findings as a GitHub Issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: scraper-findings
          ASSIGNEE: outandaboutmarin
        run: |
          set -uo pipefail

          if [ ! -f scraper_findings.json ]; then
            echo "No scraper_findings.json — scraper.py did not get far enough. Nothing to report."
            exit 0
          fi

          COUNT=$(jq -r '.count' scraper_findings.json)
          SIG=$(jq -r '.signature' scraper_findings.json)
          # Fold in the duplicate check, which runs after the purge and so sees
          # the same data the live site will.
          if [ "${DUPES:-0}" = "1" ]; then
            COUNT=$((COUNT + 1))
            SIG="${SIG} || duplicates:present"
          fi

          gh label create "$LABEL" --color FBCA04 \
            --description "Daily scraper found something needing attention" 2>/dev/null || true

          NUM=$(gh issue list --label "$LABEL" --state open --limit 1 \
                  --json number --jq '.[0].number // empty')

          # ── Nothing to report ──────────────────────────────────────────────
          if [ "$COUNT" -eq 0 ]; then
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body \
                "All clear as of $(date -u +'%Y-%m-%d') — the findings above no longer appear. Closing automatically."
              gh issue close "$NUM"
              echo "Closed issue #${NUM}; nothing outstanding."
            else
              echo "Nothing to report, and no open issue. Silent."
            fi
            exit 0
          fi

          # ── Build the body ─────────────────────────────────────────────────
          # Written by python rather than shell so the em dashes and accented
          # venue names in the findings survive intact.
          python - <<'PY'
          import json, os, io
          d = json.load(io.open("scraper_findings.json", encoding="utf-8"))
          dupes = os.environ.get("DUPES", "0") == "1"
          sig = d["signature"] + (" || duplicates:present" if dupes else "")
          L = ["The daily scraper flagged the following on its "
               f"{d['generated']} run. This issue updates itself and closes "
               "automatically once everything clears.", ""]
          reop = [f for f in d["findings"] if f["kind"] == "reopening"]
          need = [f for f in d["findings"] if f["kind"] == "needs_date"]
          if reop:
              L += ["### Reopening within 7 days", ""]
              L += [f"- {f['text']}" for f in reop] + [""]
          if need:
              L += ["### Needs one-off dates added", "",
                    "These recur on no fixed rule, so dates have to be looked "
                    "up and entered by hand.", ""]
              L += [f"- {f['text']}" for f in need] + [""]
          if dupes:
              L += ["### Possible duplicate events", "",
                    "`check_duplicates.py` found something. Full output is in "
                    "the workflow run log.", ""]
              try:
                  rep = io.open("duplicate_report.txt", encoding="utf-8").read().strip()
                  if rep:
                      L += ["```", rep[:3000], "```", ""]
              except OSError:
                  pass
          L += ["---", "",
                "To act on this, open a chat with Claude and paste in the "
                "items above.", "",
                f"<!-- signature: {sig} -->"]
          io.open("issue_body.md", "w", encoding="utf-8").write("\n".join(L))
          PY

          # ── Create, update, or stay quiet ──────────────────────────────────
          if [ -z "$NUM" ]; then
            gh issue create \
              --title "Daily scraper: items needing attention" \
              --body-file issue_body.md \
              --label "$LABEL" \
              --assignee "$ASSIGNEE"
            echo "Opened a new findings issue."
          else
            PREV=$(gh issue view "$NUM" --json body --jq '.body' \
                     | sed -n 's/.*<!-- signature: \(.*\) -->.*/\1/p')
            if [ "$PREV" = "$SIG" ]; then
              echo "Issue #${NUM} already reports exactly these findings. Staying quiet."
            else
              gh issue edit "$NUM" --body-file issue_body.md
              gh issue comment "$NUM" --body \
                "Findings changed on the $(date -u +'%Y-%m-%d') run — updated above."
              echo "Updated issue #${NUM}."
            fi
          fi
