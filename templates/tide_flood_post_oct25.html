<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tide Flood Post</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Instagram tide-flooding slide, one intersection, five days.
     Colours match weekly_post_template.html (lifted from index.html).
     Render: python render_slides.py templates/tide_flood_post.html */
  :root{
    --navy:#0D1B3E; --off-white:#F4F3EF; --card-border:#E2DED6;
    --ink-2:#333; --muted:#6b6b73;
    --flood:#C0392B; --flood-soft:#FBDDDD; --track:#E7E3DA;
    --serif:'Playfair Display',Georgia,serif;
    --sans:'Jost','Helvetica Neue',Arial,sans-serif;
    --page:#EDEBE5; --page-ink:#1c1c22;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --page:#15161a; --page-ink:#e9e7e2; }
  }
  :root[data-theme="dark"]{ --page:#15161a; --page-ink:#e9e7e2; }
  body{margin:0;background:var(--page);color:var(--page-ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;padding:32px 16px 64px;}

  .slide{container-type:inline-size;aspect-ratio:4/5;overflow:hidden;position:relative;
         background:var(--off-white);display:flex;flex-direction:column;
         box-shadow:0 6px 22px rgba(13,27,62,.16);}

  /* header */
  .head{padding:5cqw 6.5cqw 2cqw;}
  .kicker{font-size:2.3cqw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
          color:var(--flood);display:flex;align-items:center;gap:1.6cqw;}
  .kicker::before{content:"";width:1.8cqw;height:1.8cqw;border-radius:50%;background:var(--flood);}
  .title{font-family:var(--serif);font-weight:600;font-size:8.6cqw;line-height:1.02;
         color:var(--navy);margin:1.2cqw 0 1cqw;letter-spacing:-.015em;}
  .where{font-size:2.6cqw;color:var(--ink-2);font-weight:400;}

  /* day rows */
  .days{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;
        padding:0 6.5cqw;}
  .row{display:grid;grid-template-columns:13cqw 1fr;column-gap:3cqw;align-items:center;}
  .day .dn{font-family:var(--serif);font-size:4.2cqw;font-weight:600;color:var(--navy);line-height:1;}
  .day .dd{font-size:2.1cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
           margin-top:.8cqw;}
  .track{position:relative;height:3.6cqw;margin-top:1.2cqw;background:var(--track);border-radius:999px;}
  .closed{position:absolute;top:0;bottom:0;background:var(--flood);border-radius:999px;}
  .high{position:absolute;top:-.7cqw;bottom:-.7cqw;width:.6cqw;margin-left:-.3cqw;
        background:var(--navy);border-radius:2px;}
    .ticks{position:relative;height:2.2cqw;margin-top:.9cqw;font-size:1.75cqw;color:var(--muted);}
  .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap;}
  .ticks span:first-child{transform:none;}
  .ticks span:last-child{transform:translateX(-100%);}
  .facts{font-size:2.3cqw;color:var(--ink-2);}
  .facts b{color:var(--flood);font-weight:600;}
  .facts .ht{color:var(--navy);font-weight:500;}

  /* legend + footer */
  .legend{display:flex;gap:4cqw;padding:1.5cqw 6.5cqw 2.6cqw;font-size:2cqw;color:var(--muted);}
  .legend i{display:inline-block;vertical-align:middle;margin-right:1.2cqw;}
  .legend .lc{width:5cqw;height:2cqw;border-radius:999px;background:var(--flood);}
  .legend .lh{width:.5cqw;height:2.6cqw;background:var(--navy);}
  .foot{background:var(--navy);color:#fff;padding:2.4cqw 6.5cqw;flex:0 0 auto;display:flex;
        justify-content:space-between;align-items:center;}
  .foot .wm{font-family:var(--serif);font-size:3.2cqw;font-weight:600;}
  .foot .wm .and{font-family:var(--sans);font-size:1.7cqw;letter-spacing:.2em;
                 vertical-align:middle;margin:0 .35cqw;}
  .foot .src{font-size:1.8cqw;color:rgba(255,255,255,.62);text-align:right;line-height:1.4;}

  /* remove class="sample" from the slide once real closure data is in */
  .slide.sample::after{content:"SAMPLE DATA";position:absolute;top:5.5cqw;right:6.5cqw;
        font-size:1.9cqw;font-weight:600;letter-spacing:.18em;color:var(--flood);
        border:1px solid var(--flood);padding:.8cqw 1.8cqw;border-radius:999px;}

  /* six rows: tighter than the five-row template */
  .head{padding:4.4cqw 6.5cqw 1.2cqw;}
  .title{font-size:7.6cqw;margin:.8cqw 0 .6cqw;}
  .where{font-size:2.4cqw;}
  .day .dn{font-size:3.8cqw;}
  .day .dd{font-size:1.9cqw;margin-top:.5cqw;}
  .facts{font-size:2.15cqw;}
  .track{height:3.1cqw;margin-top:.9cqw;}
  .ticks{height:2cqw;margin-top:.6cqw;font-size:1.65cqw;}
  .legend{padding:1.2cqw 6.5cqw 2cqw;}
  .foot{padding:2.2cqw 6.5cqw;}

  /* brand blues and greys, to match cover D (colours from index.html) */
  .slide{background:#F4F3EF;}
  .kicker{color:#0C447C;}
  .kicker::before{background:#0C447C;}
  .title, .day .dn{color:#0D1B3E;}
  .where, .facts{color:#555555;}
  .day .dd, .ticks, .legend{color:#555555;}
  .track{background:#E7E3DA;}
  .closed{background:#0C447C;}
  .high{background:#fff;box-shadow:0 0 0 .25cqw #0D1B3E;}
  .facts b{color:#0C447C;}
  .facts .ht{color:#0D1B3E;}
  .legend .lc{background:#0C447C;}
  .legend .lh{background:#fff;box-shadow:0 0 0 .25cqw #0D1B3E;}

  /* 4:5 (1080x1350): larger type to use the extra height */
  .head{padding:5.5cqw 6.5cqw 2cqw;}
  .kicker{font-size:2.7cqw;}
  .title{font-size:9.2cqw;margin:1.2cqw 0 .8cqw;}
  .where{font-size:2.7cqw;}
  .row{grid-template-columns:14cqw 1fr;}
  .day .dn{font-size:4.4cqw;}
  .day .dd{font-size:2.1cqw;}
  .facts{font-size:2.45cqw;white-space:nowrap;}
  .track{height:3.6cqw;margin-top:1cqw;}
  .ticks{height:2.2cqw;margin-top:.7cqw;font-size:1.85cqw;}
  .legend{font-size:2.2cqw;padding:1.6cqw 6.5cqw 2.6cqw;}
  .foot .wm{font-size:3.8cqw;}
  .foot .src{font-size:2.1cqw;}
</style>
</head>
<body>
<div class="wrap">
  <div class="slide" id="slide">
    <div class="head">
      <div class="kicker">Tide flooding watch</div>
      <h1 class="title">Manzanita</h1>
      <div class="where">Shoreline Hwy at Hwy 101 · Mill Valley · Sun Oct 25 – Fri Oct 30</div>
    </div>
    <div class="days" id="days"></div>
    <div class="legend"><span><i class="lc"></i>*Estimated closure (tide above 6.8 ft)</span><span><i class="lh"></i>High tide</span></div>
    <div class="foot">
      <div class="wm">Out <span class="and">AND</span> About Marin</div>
      
    </div>
  </div>
</div>
<script>
/* One row per day. Times are 24h "HH:MM"; height in ft (site's +1.25 adjustment included; was +1.07 until 2026-10-23).
   High tide = the one during working hours. Every bar spans the same fixed window, 7 AM to 9 PM.
   Data: the Tam Junction column of the Resources tide table (tides.json + 1.25 ft).
   Closure = estimated time the tide is above 6.8 ft, by cosine interpolation between
   the neighbouring low and high tides, rounded to 5 minutes. */
const DAYS = [
  {dn:'Sun', dd:'Oct 25', high:'11:17', ft:7.3, close:'10:00', open:'12:25'},
  {dn:'Mon', dd:'Oct 26', high:'11:49', ft:7.5, close:'10:05', open:'13:15'},
  {dn:'Tue', dd:'Oct 27', high:'12:25', ft:7.7, close:'10:30', open:'13:55'},
  {dn:'Wed', dd:'Oct 28', high:'13:06', ft:7.8, close:'11:00', open:'14:45'},
  {dn:'Thu', dd:'Oct 29', high:'13:53', ft:7.5, close:'11:55', open:'15:20'},
  {dn:'Fri', dd:'Oct 30', high:'14:49', ft:7.3, close:'13:00', open:'16:10'},
];
const START = 7 * 60, END = 21 * 60;  // 7 AM to 9 PM, the same on every row
const WINDOW = END - START;
const mins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmt = (m, ampm = true) => {
  m = ((m % 1440) + 1440) % 1440;
  const h = Math.floor(m / 60), mm = m % 60, h12 = h % 12 || 12;
  return h12 + (mm ? ':' + String(mm).padStart(2, '0') : '') + (ampm ? (h < 12 ? ' AM' : ' PM') : '');
};
const pct = (m, start) => Math.max(0, Math.min(100, (m - start) / WINDOW * 100));

document.getElementById('days').innerHTML = DAYS.map(d => {
  const hi = mins(d.high);
  const start = START;
  const c0 = pct(mins(d.close), start), c1 = pct(mins(d.open), start);
  const hours = WINDOW / 60;
  const ticks = Array.from({length: hours + 1}, (_, i) =>
    `<span style="left:${i / hours * 100}%">${i % 2 ? '' : fmt(start + i * 60)}</span>`).join('');
  return `<div class="row">
    <div class="day"><div class="dn">${d.dn}</div><div class="dd">${d.dd}</div></div>
    <div>
      <div class="facts"><b>Closed* ${fmt(mins(d.close))} – ${fmt(mins(d.open))}</b> · <span class="ht">High tide ${fmt(hi)} · ${d.ft.toFixed(1)} ft</span></div>
      <div class="track">
        <div class="closed" style="left:${c0}%;width:${c1 - c0}%"></div>
        <div class="high" style="left:${pct(hi, start)}%"></div>
      </div>
      <div class="ticks">${ticks}</div>
    </div>
  </div>`;
}).join('');
</script>
</body>
</html>
